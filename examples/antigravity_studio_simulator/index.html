<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khóa học Antigravity Basic — Mục lục Chia đôi 6 Chương &amp; Phòng học Tương tác</title>
<meta name="description" content="Mục lục chia đôi 6 Chương · 24 Bài giảng (1 cột tinh gọn) và trình phát bài giảng tương tác khóa học Antigravity Basic với thuyết minh VieNeu-TTS 48kHz.">
<link rel="stylesheet" href="assets/css/brand_tokens.css">
<style id="kudo-a11y-motion">
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--kudo-font-sans, 'Segoe UI', Inter, system-ui, sans-serif);
    background: #FAF8F5;
    color: #1E293B;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* =========================================================================
     1. THANH ĐIỀU HƯỚNG ĐỈNH TINH GỌN (BE KEM & CAM ĐẤT)
     ========================================================================= */
  .top-nav {
    height: 50px;
    background: #EFE9DD;
    border-bottom: 1px solid #DDD5C7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    gap: 12px;
    z-index: 100;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .brand-logo {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, #EA580C, #CB4B16);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13.5px;
    color: #FFFFFF;
    cursor: pointer;
  }
  .brand-title {
    font-size: 14px;
    font-weight: 800;
    color: #1E293B;
    white-space: nowrap;
    cursor: pointer;
  }
  .home-switch-btn {
    background: #FFF7ED;
    color: #C2410C;
    border: 1.5px solid #FB923C;
    min-height: 32px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .home-switch-btn:hover,
  .home-switch-btn.active-home {
    background: linear-gradient(135deg, #EA580C, #CB4B16);
    border-color: #C2410C;
    color: #FFFFFF;
  }

  /* Điều hướng Bài trước / Bài đang học / Bài tiếp gọn gàng ở giữa */
  .top-center-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: center;
    min-width: 0;
  }
  .step-nav-btn {
    background: #FFFFFF;
    color: #1E293B;
    border: 1px solid #D6CEC0;
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .step-nav-btn:hover:not(:disabled) {
    background: #FFF7ED;
    border-color: #EA580C;
    color: #C2410C;
  }
  .step-nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .current-lesson-trigger {
    background: #FFFFFF;
    border: 1px solid #C8BFA8;
    border-radius: 8px;
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    max-width: 520px;
    min-width: 260px;
    transition: border-color 0.15s;
  }
  .current-lesson-trigger:hover {
    border-color: #EA580C;
  }
  .clt-badge {
    background: #FFF7ED;
    color: #C2410C;
    border: 1px solid #FDBA74;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .clt-title {
    font-size: 13px;
    font-weight: 700;
    color: #1E293B;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    text-align: left;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .open-full-btn {
    background: #FFFFFF;
    color: #334155;
    border: 1px solid #D6CEC0;
    min-height: 32px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .open-full-btn:hover {
    background: #FFF7ED;
    border-color: #EA580C;
    color: #C2410C;
  }

  /* =========================================================================
     2. CỔNG MỤC LỤC CHIA ĐÔI TỐI GIẢN (#home-view)
        - Bỏ hoàn toàn phần giới thiệu dài dòng
        - Cột Trái (350px): Danh sách 6 Chương + Ô tìm kiếm
        - Cột Phải (1fr): Danh sách Bài học xếp 1 Cột duy nhất
     ========================================================================= */
  #home-view {
    flex: 1;
    height: calc(100vh - 50px);
    display: grid;
    grid-template-columns: 350px minmax(0, 1fr);
    background: #FAF8F5;
    overflow: hidden;
  }
  #home-view.hidden-view {
    display: none !important;
  }

  /* Cột Trái: Danh sách 6 Chương */
  .hub-left-chapters {
    background: #F4EFE6;
    border-right: 1px solid #DDD5C7;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  .hlc-search-bar {
    padding: 12px 14px;
    background: #EFE9DD;
    border-bottom: 1px solid #DDD5C7;
  }
  .hlc-search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #FFFFFF;
    border: 1px solid #C8BFA8;
    border-radius: 8px;
    padding: 7px 11px;
  }
  .hlc-search-box input {
    border: none;
    background: transparent;
    color: #1E293B;
    font-size: 13px;
    width: 100%;
    outline: none;
  }

  .hlc-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chap-split-item {
    background: #FFFFFF;
    border: 1.5px solid #DDD5C7;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: all 0.15s;
  }
  .chap-split-item:hover {
    border-color: #EA580C;
  }
  .chap-split-item.active {
    background: #FFF7ED;
    border-color: #EA580C;
    box-shadow: 0 3px 10px rgba(234, 88, 12, 0.1);
  }
  .csi-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 800;
    color: #C2410C;
  }
  .csi-count {
    font-size: 11px;
    font-weight: 700;
    color: #64748B;
  }
  .csi-title {
    font-size: 14px;
    font-weight: 800;
    color: #1E293B;
    line-height: 1.35;
  }

  /* Cột Phải: Danh sách Bài học 1 Cột duy nhất */
  .hub-right-lessons {
    background: #FAF8F5;
    height: 100%;
    overflow-y: auto;
    padding: 20px 28px 36px 28px;
  }
  .hrl-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .hrl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1.5px solid #DDD5C7;
  }
  .hrl-title {
    font-size: 18px;
    font-weight: 900;
    color: #1E293B;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hrl-badge {
    background: #EA580C;
    color: #FFFFFF;
    font-size: 11.5px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .hrl-start-btn {
    background: linear-gradient(135deg, #EA580C, #CB4B16);
    color: #FFFFFF;
    border: 1px solid #C2410C;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Danh sách 1 Cột các Bài học */
  .one-col-lessons-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .one-col-lesson-card {
    background: #FFFFFF;
    border: 1.5px solid #DDD5C7;
    border-radius: 11px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ocl-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    width: 100%;
  }
  .ocl-beats-flat {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 8px;
    border-top: 1px dashed #DDD5C7;
    width: 100%;
  }
  .ocl-beat-row {
    width: 100%;
    background: #FAF8F5;
    border: 1px solid #E2DACB;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: #1E293B;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: all 0.12s;
  }
  .ocl-beat-row:hover {
    border-color: #EA580C;
    background: #FFF7ED;
    color: #C2410C;
  }
  .ocl-beat-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .ocl-beat-tag {
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 5px;
    background: #FEF3C7;
    color: #92400E;
    border: 1px solid #FDE68A;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ocl-beat-tag.sim {
    background: #DBEAFE;
    color: #1E40AF;
    border-color: #BFDBFE;
  }
  .ocl-beat-dur {
    font-family: monospace;
    font-size: 12px;
    font-weight: 700;
    color: #64748B;
    flex-shrink: 0;
  }
  .one-col-lesson-card:hover {
    border-color: #EA580C;
    background: #FFFDF9;
    box-shadow: 0 4px 14px rgba(234, 88, 12, 0.08);
  }
  .one-col-lesson-card.active {
    border-color: #EA580C;
    background: #FFF7ED;
  }
  .ocl-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .ocl-code {
    background: #F4EFE6;
    border: 1px solid #C8BFA8;
    color: #C2410C;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ocl-name {
    font-size: 15.5px;
    font-weight: 800;
    color: #1E293B;
    line-height: 1.35;
  }
  .ocl-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .ocl-meta {
    font-size: 12px;
    font-weight: 700;
    color: #64748B;
    white-space: nowrap;
  }
  .ocl-enter {
    background: #EA580C;
    color: #FFFFFF;
    border: none;
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  /* =========================================================================
     3. KHUNG TRÌNH PHÁT BÀI GIẢNG (#player-view)
     ========================================================================= */
  .player-stage {
    flex: 1;
    background: #FAF8F5;
    position: relative;
    width: 100%;
    height: calc(100vh - 50px);
    overflow: hidden;
  }
  .player-stage.hidden-view {
    display: none !important;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  @media (max-width: 900px) {
    #home-view {
      grid-template-columns: 1fr;
      overflow-y: auto;
    }
    .hub-left-chapters {
      height: auto;
      border-right: none;
      border-bottom: 1px solid #DDD5C7;
    }
  }
</style>
</head>
<body>
  <!-- THANH ĐIỀU HƯỚNG ĐỈNH -->
  <div class="top-nav">
    <div class="brand">
      <div class="brand-logo" id="hub-logo" onclick="showHomeView()" title="Về Mục lục Chia đôi">A</div>
      <div class="brand-title" id="hub-title" onclick="showHomeView()">Antigravity Basic</div>
      <button class="home-switch-btn active-home" id="btn-toggle-home" onclick="toggleHomePlayerView()" title="Chuyển giữa Mục lục 6 Chương và Phòng học">🗂️ Mục lục 6 Chương</button>
    </div>

    <div class="top-center-stepper">
      <button class="step-nav-btn" id="btn-prev-ls" onclick="stepActiveLesson(-1)">◀ Bài trước</button>
      <div class="current-lesson-trigger" onclick="toggleHomePlayerView()" title="Bấm để mở Mục lục Chia đôi 6 Chương · 24 Bài">
        <span class="clt-badge" id="top-cur-chap">CHƯƠNG 1/6</span>
        <span class="clt-title" id="top-cur-title">BÀI 1 — Tư duy Trợ lý AI trên Máy tính &amp; 2 Phần mềm Cốt lõi</span>
        <span style="font-size:11px;color:#64748B;">▾</span>
      </div>
      <button class="step-nav-btn" id="btn-next-ls" onclick="stepActiveLesson(1)">Bài tiếp ▶</button>
    </div>

    <div class="nav-right">
      <a class="open-full-btn" id="hub-open-full" href="lesson_01.html" target="_blank" title="Mở bài học đang xem ra cửa sổ toàn màn hình">↗ Toàn màn hình</a>
    </div>
  </div>

  <!-- MÀN HÌNH 1: CỔNG MỤC LỤC CHIA ĐÔI (TRÁI: 6 CHƯƠNG | PHẢI: 1 CỘT BÀI HỌC) -->
  <section id="home-view" aria-label="Mục lục chia đôi 6 Chương 24 Bài giảng">
    <aside class="hub-left-chapters">
      <div class="hlc-search-bar">
        <div class="hlc-search-box">
          <span>🔍</span>
          <input type="text" id="hub-search-input" placeholder="Tìm nhanh bài học..." oninput="renderSplitHub()">
        </div>
      </div>
      <div class="hlc-list" id="chapters-split-nav"></div>
    </aside>

    <div class="hub-right-lessons">
      <div class="hrl-inner" id="chapters-grid"></div>
    </div>
  </section>

  <!-- MÀN HÌNH 2: KHUNG TRÌNH PHÁT BÀI GIẢNG -->
  <main class="player-stage hidden-view" id="player-view">
    <iframe id="lesson-iframe" src="lesson_01.html" title="Khung trình chiếu bài giảng Antigravity Basic" allow="autoplay"></iframe>
  </main>

  <script src="config/brand_config.js"></script>
  <script src="config/course_manifest.js"></script>
  <script src="config/chapters_manifest.js"></script>
  <script>
    let currentSelectedChapterNum = 1;
    let currentActiveFilename = "lesson_01.html";

    function findLessonMeta(filename) {
      const list = window.KUDO_COURSE_MANIFEST || [];
      return list.find(x => x.filename === filename) || list[0] || null;
    }

    function syncActiveLessonUi(filename) {
      if (!filename) return;
      currentActiveFilename = filename;
      const list = window.KUDO_COURSE_MANIFEST || [];
      const idx = list.findIndex(x => x.filename === filename);
      const item = idx >= 0 ? list[idx] : list[0];

      if (item) {
        if (item.chapter_number) currentSelectedChapterNum = item.chapter_number;
        const chapEl = document.getElementById("top-cur-chap");
        const titleEl = document.getElementById("top-cur-title");
        if (chapEl) chapEl.textContent = (item.chapter_code || "CHƯƠNG 1") + "/6";
        if (titleEl) titleEl.textContent = `${item.code} — ${item.title}`;
      }

      const prevBtn = document.getElementById("btn-prev-ls");
      const nextBtn = document.getElementById("btn-next-ls");
      if (prevBtn) prevBtn.disabled = (idx <= 0);
      if (nextBtn) nextBtn.disabled = (idx < 0 || idx >= list.length - 1);

      const fullBtn = document.getElementById("hub-open-full");
      if (fullBtn) fullBtn.href = filename;

      renderSplitHub();
    }

    function stepActiveLesson(delta) {
      const list = window.KUDO_COURSE_MANIFEST || [];
      const idx = list.findIndex(x => x.filename === currentActiveFilename);
      const nextIdx = Math.max(0, Math.min(list.length - 1, (idx >= 0 ? idx : 0) + delta));
      if (list[nextIdx]) {
        openChapterLesson(list[nextIdx].filename);
      }
    }

    function toggleHomePlayerView() {
      const homeEl = document.getElementById("home-view");
      if (homeEl && homeEl.classList.contains("hidden-view")) {
        showHomeView();
      } else {
        showPlayerView();
      }
    }

    function showHomeView() {
      const homeEl = document.getElementById("home-view");
      const playerEl = document.getElementById("player-view");
      const homeBtn = document.getElementById("btn-toggle-home");
      if (homeEl) homeEl.classList.remove("hidden-view");
      if (playerEl) playerEl.classList.add("hidden-view");
      if (homeBtn) {
        homeBtn.classList.add("active-home");
        homeBtn.textContent = "▶️ Quay lại Bài đang học";
      }
      const ifr = document.getElementById("lesson-iframe");
      if (ifr && ifr.contentWindow) {
        try {
          const vp = ifr.contentWindow.document.getElementById("kudo-voice-player");
          if (vp && !vp.paused) vp.pause();
        } catch (e) {}
      }
      renderSplitHub();
    }

    function showPlayerView() {
      const homeEl = document.getElementById("home-view");
      const playerEl = document.getElementById("player-view");
      const homeBtn = document.getElementById("btn-toggle-home");
      if (homeEl) homeEl.classList.add("hidden-view");
      if (playerEl) playerEl.classList.remove("hidden-view");
      if (homeBtn) {
        homeBtn.classList.remove("active-home");
        homeBtn.textContent = "🗂️ Mục lục 6 Chương";
      }
    }

    function openChapterLesson(url) {
      if (!url) return;
      showPlayerView();
      const ifr = document.getElementById("lesson-iframe");
      if (ifr && !ifr.src.endsWith(url)) {
        ifr.src = url;
      }
      syncActiveLessonUi(url);
    }

    function selectHubChapter(chNum) {
      currentSelectedChapterNum = chNum;
      renderSplitHub();
    }

    function renderSplitHub() {
      const chapters = window.KUDO_CHAPTERS_MANIFEST || [];
      const navWrap = document.getElementById("chapters-split-nav");
      const rightWrap = document.getElementById("chapters-grid");
      const q = (document.getElementById("hub-search-input")?.value || "").trim().toLowerCase();

      if (navWrap) {
        navWrap.innerHTML = chapters.map(ch => `
          <div class="chap-split-item ${ch.chapter_number === currentSelectedChapterNum ? 'active' : ''}" onclick="selectHubChapter(${ch.chapter_number})">
            <div class="csi-top">
              <span>${ch.code}</span>
              <span class="csi-count">${ch.lessons_count} bài</span>
            </div>
            <div class="csi-title">${ch.title}</div>
          </div>
        `).join("");
      }

      if (!rightWrap) return;
      const activeCh = chapters.find(c => c.chapter_number === currentSelectedChapterNum) || chapters[0];
      if (!activeCh) return;

      let rows = [];
      if (q) {
        chapters.forEach(ch => {
          (ch.lessons || []).forEach(ls => {
            if ((ls.title || "").toLowerCase().includes(q) || (ls.code || "").toLowerCase().includes(q)) {
              rows.push({ ch, ls });
            }
          });
        });
      } else {
        rows = (activeCh.lessons || []).map(ls => ({ ch: activeCh, ls }));
      }

      rightWrap.innerHTML = `
        <div class="hrl-header">
          <div class="hrl-title">
            <span class="hrl-badge">${q ? 'KẾT QUẢ LỌC' : activeCh.code}</span>
            <span>${q ? `Tìm thấy ${rows.length} bài giảng` : activeCh.title}</span>
          </div>
          ${(!q && activeCh.default_lesson) ? `<button class="hrl-start-btn" onclick="openChapterLesson('${activeCh.default_lesson}')">▶ Học từ đầu ${activeCh.code}</button>` : ''}
        </div>
        <div class="one-col-lessons-stack">
          ${rows.map(({ ch, ls }) => `
            <div class="one-col-lesson-card ${ls.filename === currentActiveFilename ? 'active' : ''}" onclick="openChapterLesson('${ls.filename || 'lesson_01.html'}')">
              <div class="ocl-top-row">
                <div class="ocl-left">
                  <span class="ocl-code">${q ? (ch.code + ' · ' + ls.code) : ls.code}</span>
                  <span class="ocl-name">${ls.title}</span>
                </div>
                <div class="ocl-right">
                  <span class="ocl-meta">${ls.meta || '6 phần tương tác'}</span>
                  <button class="ocl-enter">Vào học ▸</button>
                </div>
              </div>
              ${(Array.isArray(ls.beats) && ls.beats.length > 0) ? `
                <div class="ocl-beats-flat">
                  ${ls.beats.map(b => `
                    <div class="ocl-beat-row" onclick="event.stopPropagation(); openChapterLesson('${ls.filename || 'lesson_01.html'}')">
                      <div class="ocl-beat-left">
                        <span class="ocl-beat-tag ${b.mode === 'sim' ? 'sim' : ''}">${b.mode === 'theory' ? '📖 Lý thuyết' : '🖱️ Thực hành'}</span>
                        <span>${b.title}</span>
                      </div>
                      <span class="ocl-beat-dur">${b.dur} ▸</span>
                    </div>
                  `).join("")}
                </div>
              ` : ''}
            </div>
          `).join("")}
        </div>
      `;
    }

    window.addEventListener("message", (ev) => {
      if (ev && ev.data && ev.data.type === "KUDO_SWITCH_LESSON" && ev.data.filename) {
        syncActiveLessonUi(ev.data.filename);
      } else if (ev && ev.data && ev.data.type === "KUDO_SHOW_HOME") {
        showHomeView();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      syncActiveLessonUi("lesson_01.html");
      if (window.location.search.includes("view=player") || window.location.hash === "#player") {
        showPlayerView();
      }
    });
  </script>
</body>
</html>
